<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Racing Line Art Kit</title>
    <style>
      @font-face {
        font-family: 'Geist';
        src: url('./fonts/Geist-Variable.woff2') format('woff2');
        font-weight: 100 900;
      }
      :root {
        --bg: #faf4e4;
        --panel: #fffdf7;
        --rule: #141418;
        --ink: #141418;
        --muted: #5f5c55;
        --sans: 'Geist', system-ui, -apple-system, sans-serif;
        --mono: 'Geist', system-ui, sans-serif;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.5 var(--sans);
        padding: 28px max(16px, env(safe-area-inset-left)) 64px max(16px, env(safe-area-inset-right));
      }
      main {
        max-width: 1040px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 40px;
      }
      header {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: 64ch;
      }
      h1 {
        margin: 0;
        font-size: clamp(30px, 7vw, 48px);
        line-height: 1;
        font-weight: 800;
        font-style: italic;
        letter-spacing: -0.03em;
      }
      h2 {
        margin: 0;
        font-size: 20px;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
      }
      .eyebrow,
      figcaption,
      code {
        font-family: var(--mono);
      }
      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .muted {
        color: var(--muted);
      }
      section {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: flex-end;
      }
      figure {
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: flex-start;
        min-width: 0;
      }
      figure .art {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 72px;
        padding: 12px;
        background: var(--panel);
        border: 2.5px solid var(--rule);
        border-radius: 10px;
        box-shadow: 3px 3px 0 var(--rule);
        max-width: 100%;
      }
      figure.wide {
        flex: 1 1 320px;
        max-width: 460px;
      }
      figure.wide .art {
        justify-content: flex-start;
        width: 100%;
      }
      figure.bare .art {
        background: none;
        border: 0;
        box-shadow: none;
        padding: 0;
        justify-content: flex-start;
      }
      figure.tap {
        cursor: pointer;
      }
      figcaption {
        font-size: 11.5px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <canvas id="c" width="1" height="1" hidden></canvas>
    <main id="gallery">
      <header>
        <p class="eyebrow">Racing Line · art kit</p>
        <h1>Ink, paper, <span style="color: #d93829">one red.</span></h1>
        <p class="muted">
          The story layer's art, drawn in code in <code>src/art/</code> like the game it ships in: one ink
          line round every shape, flat fills, hard shadows down-right, Geist only. Before lights out the world
          is an uncoloured comic page; colour belongs to racing.
        </p>
      </header>
    </main>
    <link rel="stylesheet" href="./assets/art.css" />
    <script type="module" src="./assets/art.js"></script>
  </body>
</html>
